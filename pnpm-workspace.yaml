# Versions published less than 3 days ago (in minutes) are not installed: most hijacked packages
# are pulled from the registry within hours.
minimumReleaseAge: 4320

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Patched versions of dependencies' own pins (pnpm audit).
overrides:
  "@vercel/cli-config>zod": ^4.6.7
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
